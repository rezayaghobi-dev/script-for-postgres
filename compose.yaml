
services:
  postgres:
    image: postgres:17
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: reza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reza -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

